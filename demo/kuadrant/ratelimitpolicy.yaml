# Tight RateLimitPolicy — primary N-S wow (visible 429 under make demo-ratelimit).
# Limit homepage requests only; assets and voting must not consume the demo quota.
# Emojivoto renders a misleading "404" page for any failed vote, including HTTP 429.
---
apiVersion: kuadrant.io/v1
kind: RateLimitPolicy
metadata:
  name: emojivoto-rlp
  namespace: gateway-system
  labels:
    demo.kcd.ar/wow: ratelimit
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: demo
  limits:
    "demo-wow":
      when:
        - predicate: "request.url_path == '/'"
      rates:
        - limit: 3
          window: 10s
